[workspace]
resolver = "3"
members = ["crates/physics", "crates/physics-wasm"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

# The solver tests run thousands of FFT steps; optimise the physics crate even in test and dev builds.
[profile.dev.package.physics]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
